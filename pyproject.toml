# VPBuddy — 现代 Python 包声明 (2026-06-21 ADR-0009 → 2026-07-01 v0.6 ADR-0019~0025)
#
# 之前只用 requirements.txt;现在补 pyproject.toml 作为包元数据 + hermes 依赖声明。
# 部署仍可用 `pip install -r requirements.txt` 走老路;新部署用 `pip install .` 走 pyproject。
#
# v0.6 关键变更 (ADR-0019 RAG 选型 + ADR-0020 KB 方案废弃):
#   - 删 `sqlite-vec` (旧 KB, 废弃, ADR-0012 superseded)
#   - 加 `chromadb>=0.5` (新 RAG 嵌入式, ADR-0019)
#   - 加 `pypdf` (KB 上传 PDF 抽文本, ADR-0020)
#   - 加 `duckduckgo-search` (agent web_search 工具, ADR-0025)
#   - version 0.2.0 → 0.6.0 (合入 8 项需求)
#
# 关键变更 (历史):
#   - 新增 `hermes-agent>=0.16.0,<1.0` 依赖 (ADR-0009)
#   - 新增 `[project.scripts]` 让 `vpbuddy` 命令可调用
#   - 新增 optional `[gpu]` extra 装 GPU 模型
#   - 新增 `[dev]` extra 装测试/lint

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpbuddy"
version = "0.8.0"
description = "人机协同会议操作系统级 AI 助手 — 运行在 Hermes Agent 之上"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "张胜东", email = "zhangsheng377@users.noreply.github.com"},
]
keywords = ["vp", "meeting", "ai-assistant", "asr", "diarization", "hermes-agent", "rag", "tauri"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# ===== 核心依赖 (ADR-0009 关键:hermes-agent 是 runtime) =====
# ⚠️ 重要:`hermes-agent` 是 pip 包名,但 Python 模块路径是 `run_agent`(不是 `hermes_agent`)
# editable install 用 metapath finder 把散模块挂到 namespace
# 详见 src/vpbuddy/sub_session_controller.py 与 ADR-0009 §集成方式
dependencies = [
    # Hermes Agent runtime (ADR-0009 — VPBuddy = Hermes skill,不可绕过)
    "hermes-agent>=0.16.0,<1.0",

    # 数据模型
    "pydantic>=2.0,<3",

    # 知识库 / RAG (v0.6 ADR-0019 + ADR-0020)
    # 旧 sqlite-vec + sentence-transformers 全部废弃,切 Chroma 嵌入式 (in-process, 单文件夹持久化)
    # Chroma 内置 sentence-transformers 包装,所以不用单独列
    "chromadb>=0.5,<2",          # ADR-0019 选型
    "pypdf>=4.0,<6",             # ADR-0020 KB 上传 PDF 抽文本
    "numpy>=1.24,<2.8",          # Chroma 间接依赖

    # Agent 工具 (v0.6 ADR-0025)
    "duckduckgo-search>=6.0,<8", # web_search 工具 (无 API key,公开搜索)

    # 工具
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# GPU 模型 (Whisper + pyannote + funasr + faster-whisper) — ADR-0004
gpu = [
    "funasr>=1.1.0,<1.2",
    "modelscope>=1.10",
    "torch>=2.0,<3",
    "torchaudio>=2.0,<3",
    "pyannote-audio>=3.3,<4",
    "pyannote-core>=6.0,<7",
    "huggingface-hub>=1.20,<2",
    "faster-whisper>=1.0,<2",
    "ctranslate2>=3.0",
    "pydub>=0.25",
    "soundfile>=0.12",
    "librosa>=0.10",
]

# 音频采集 (VP 设备 loopback) — ADR-0004
audio = [
    "pyaudio>=0.2.13",
    "sounddevice>=0.4.6",
]

# 测试
dev = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
]

# 全部 (开发用)
all = [
    "vpbuddy[gpu,audio,dev]",
]

# ===== 命令入口 (ADR-0009 — VPBuddy CLI 入口,跟 Hermes TUI 分开) =====
[project.scripts]
# VPBuddy 自己的 CLI(给 VP/用户/管理员/开发者用)
vpbuddy = "vpbuddy.cli:main"
# 子命令: vpbuddy ui / vpbuddy controller / vpbuddy transcribe / vpbuddy setup-gpu / vpbuddy list / vpbuddy version

# Hermes CLI 不在 VPBuddy pyproject 里 — 它随 hermes-agent 包装
# Hermes TUI (`hermes` 命令) 是 Hermes 自己的 dev tool,VPBuddy 用户**不要**用 TUI 作为 UI

# ===== 入口点: Hermes skill 注册 (ADR-0009) =====
[project.entry-points."hermes.skills"]
vpbuddy = "vpbuddy.skill:VPBuddySkill"

# ===== 包发现 =====
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vpbuddy*"]

[tool.setuptools.package-data]
vpbuddy = ["py.typed", "*.md", "prompts/*.md"]

# ===== pytest 配置 =====
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["src/tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "gpu: 需要 GPU 的测试",
    "integration: 集成测试",
    "slow: 慢测试",
]

# ===== ruff =====
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # line-too-long

# ===== mypy =====
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

# ===== black =====
[tool.black]
line-length = 100
target-version = ["py311"]
