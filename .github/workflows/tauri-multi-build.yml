# VPBuddy Tauri CI - 三平台构建 (2026-06-25)
# 平台: Ubuntu (.deb) / macOS (x86_64 app) / Windows (.exe binary)

name: VPBuddy Tauri Multi-Platform Build

"on":
  push:
    branches: [main]
    paths:
      - 'vpbuddy-client/**'
      - '.github/workflows/tauri-multi-build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'vpbuddy-client/**'
      - '.github/workflows/tauri-multi-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. 单元测试 ──
  test:
    name: cargo test + check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vpbuddy-client/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vpbuddy-client/package.json

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev pkg-config librsvg2-dev \
            libsoup-3.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            dpkg-dev fakeroot

      - name: Install frontend deps + build
        working-directory: vpbuddy-client
        run: npm ci || npm install; npm run build

      - name: cargo check
        working-directory: vpbuddy-client/src-tauri
        run: cargo check

      - name: cargo test (audio_unit)
        working-directory: vpbuddy-client/src-tauri
        run: cargo test --test audio_unit

  # ── 2. Linux 构建 (.deb) ──
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vpbuddy-client/package.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vpbuddy-client/src-tauri -> target
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev pkg-config librsvg2-dev \
            libsoup-3.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            dpkg-dev fakeroot
      - name: Install frontend deps
        working-directory: vpbuddy-client
        run: npm ci || npm install
      - name: Tauri build (Linux)
        working-directory: vpbuddy-client/src-tauri
        run: npx tauri build --bundles deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpbuddy-client-linux
          path: vpbuddy-client/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  # ── 3. macOS 构建 (x86_64, --no-bundle) ──
  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vpbuddy-client/package.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vpbuddy-client/src-tauri -> target
      - name: Install frontend deps
        working-directory: vpbuddy-client
        run: npm ci || npm install
      - name: Add rustup targets
        run: rustup target add x86_64-apple-darwin
      - name: Tauri build (macOS)
        working-directory: vpbuddy-client/src-tauri
        run: npx tauri build --target x86_64-apple-darwin --no-bundle
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpbuddy-client-macos
          path: vpbuddy-client/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30

  # ── 4. Windows 构建 (.msi + .exe) ──
  # 2026-06-25: webviewInstallMode=skipRuntimeInstall 跳过 WebView2 bootstrapper 下载
  # + chocolatey 装 NSIS 出 .exe installer
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vpbuddy-client/package.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vpbuddy-client/src-tauri -> target
      - name: Install frontend deps
        working-directory: vpbuddy-client
        run: npm ci || npm install
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Tauri build (Windows)
        working-directory: vpbuddy-client/src-tauri
        run: npx tauri build --bundles nsis
      - name: Upload .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpbuddy-client-windows
          path: vpbuddy-client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  # ── 5. Release (tag push 时) ──
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.app
            artifacts/**/*.exe
