[package]
name = "vpbuddy-client"
version = "0.8.6"
description = "VPBuddy desktop client"
authors = ["张胜东 <zhangsheng@zsd.dev>"]
edition = "2021"

[lib]
name = "vpbuddy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"  # 2026-06-27: 打开日志目录用 (跨平台 reveal-in-folder)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"  # 2026-06-28: 读 ~/.vpbuddy-client.yaml (统一 GPU server URL 配置)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"  # SSE 流读取 (run_sse_loop 2026-06-25)
cpal = "0.15"
hound = "3.5"  # WAV 编码
urlencoding = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
<<<<<<< Updated upstream
dirs = "5"
chrono = "0.4"  # 客户端日志时间戳 (2026-06-27)
=======
chrono = "0.4"
dirs = "5"  # 客户端日志时间戳 (2026-06-27)
>>>>>>> Stashed changes

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
